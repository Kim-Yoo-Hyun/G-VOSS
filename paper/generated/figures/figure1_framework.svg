<text x="950.0" y="409.0" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="start">report R@K with Violation@K</text>
<rect x="50" y="492" width="1180" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="70.0" y="526.0" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">Operating points and controls</text>
<text x="70.0" y="557.0" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">probabilistic: score_sem x p_geom_valid</text>
<text x="350.0" y="557.0" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">rule-verified: remove hard violations</text>
<text x="640.0" y="557.0" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="start">family-specific: stricter calibrated validity</text>
<text x="70.0" y="584.0" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="start">controls: geometry-only, distance-only, shuffled, wrong-pair</text>
<text x="70.0" y="612.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Claim boundary: a relation-reliability layer for geometry-checkable families, not a new open-vocabulary generator.</text>
