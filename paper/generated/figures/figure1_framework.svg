<text x="50.0" y="46.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Figure 1. GeoCalib: calibrated geometry-consistency re-ranking</text>
<text x="50.0" y="74.0" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">Relation-source graph edges become identity-preserved evidence records before recall-violation evaluation.</text>
<rect x="50" y="110" width="340" height="345" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="70.0" y="140.0" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">A. Relation-source graph</text>
<text x="70.0" y="165.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">High semantic scores can rank plausible</text>
<text x="70.0" y="181.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">but physically inconsistent edges.</text>
<rect x="470" y="110" width="340" height="345" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="490.0" y="140.0" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">B. Evidence-rich edge record</text>
<text x="490.0" y="165.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">The same subject-object edge is joined to</text>
<text x="490.0" y="181.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">explicit 3D evidence and calibrated</text>
<text x="490.0" y="197.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">validity.</text>
<rect x="890" y="110" width="340" height="345" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="910.0" y="140.0" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">C. Reliable relation graph</text>
<text x="910.0" y="165.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Re-ranking demotes violated edges and</text>
<text x="910.0" y="181.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">reports recall with geometric violation.</text>
