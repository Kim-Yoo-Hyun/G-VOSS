x-h002-common: &h002-common
  build:
    context: ../..
    dockerfile: configs/h002/Dockerfile
  image: h002-compatibility-routing:latest
  working_dir: /workspace
  user: "${HOST_UID:-1001}:${HOST_GID:-1001}"
  volumes:
    - ../..:/workspace
    - ../../local_dataset:/data/local_dataset:ro
    - ../../results/h001_geom_reliability:/workspace/results/h001_geom_reliability:ro
    - ../../archive/experiments/H001_geom_reliability:/workspace/archive/experiments/H001_geom_reliability:ro

services:
  h002-protocol-check:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/preflight.py
      - --repo-root
      - /workspace
      - --local-dataset-root
      - /data/local_dataset
      - --out
      - /workspace/experiments/H002_compatibility_routing/preflight/latest

  h002-materialize-routes:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/materialize_routes.py
      - --repo-root
      - /workspace
      - --out
      - /workspace/experiments/H002_compatibility_routing/materialization/latest

  h002-materialization-schema-audit:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/audit_materialization_schema.py
      - --repo-root
      - /workspace
      - --materialization-dir
      - /workspace/experiments/H002_compatibility_routing/materialization/latest
      - --out
      - /workspace/experiments/H002_compatibility_routing/schema_audit/latest

  h002-grouped-split:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/make_grouped_split.py
      - --repo-root
      - /workspace
      - --materialization-dir
      - /workspace/experiments/H002_compatibility_routing/materialization/latest
      - --schema-audit-dir
      - /workspace/experiments/H002_compatibility_routing/schema_audit/latest
      - --out
      - /workspace/experiments/H002_compatibility_routing/splits/latest

  h002-grouped-eval:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/run_grouped_eval.py
      - --repo-root
      - /workspace
      - --split-dir
      - /workspace/experiments/H002_compatibility_routing/splits/latest
      - --protocol-dir
      - /workspace/hypothesis/CAND-001/H002_factorized-relation-confidence/artifacts/compatibility_dataset_v3_grouped_eval_protocol_after_grouped_split
      - --out
      - /workspace/experiments/H002_compatibility_routing/evaluation/latest

  h002-source-rerank-materialize:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/materialize_source_reranking_candidates.py
      - --repo-root
      - /workspace
      - --protocol-dir
      - /workspace/hypothesis/CAND-001/H002_factorized-relation-confidence/artifacts/compatibility_dataset_v3_source_reranking_materialization_protocol_after_source_inventory
      - --inventory-dir
      - /workspace/hypothesis/CAND-001/H002_factorized-relation-confidence/artifacts/compatibility_dataset_v3_source_reranking_source_inventory_after_protocol_plan
      - --subset-dir
      - /workspace/local_dataset/3DSSG_subset
      - --scan-dir
      - /workspace/local_dataset/3RScan/scans
      - --out
      - /workspace/experiments/H002_compatibility_routing/source_reranking_materialization/latest

  h002-source-rerank-schema-audit:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/audit_source_reranking_materialization_schema.py
      - --repo-root
      - /workspace
      - --materialization-dir
      - /workspace/experiments/H002_compatibility_routing/source_reranking_materialization/latest
      - --out
      - /workspace/experiments/H002_compatibility_routing/source_reranking_schema_audit/latest

  h002-source-rerank-metric-runner:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/run_source_reranking_metric.py
      - --repo-root
      - /workspace
      - --internal-split-dir
      - /workspace/experiments/H002_compatibility_routing/splits/latest
      - --materialization-dir
      - /workspace/experiments/H002_compatibility_routing/source_reranking_materialization/latest
      - --protocol-dir
      - /workspace/hypothesis/CAND-001/H002_factorized-relation-confidence/artifacts/compatibility_dataset_v3_source_reranking_metric_protocol_freeze_after_schema_audit
      - --out
      - /workspace/experiments/H002_compatibility_routing/source_reranking_evaluation/latest

  h002-source-rerank-bootstrap-ci:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/bootstrap_source_reranking_ci.py
      - --evaluation-dir
      - /workspace/experiments/H002_compatibility_routing/source_reranking_evaluation/latest
      - --materialization-dir
      - /workspace/experiments/H002_compatibility_routing/source_reranking_materialization/latest
      - --out
      - /workspace/experiments/H002_compatibility_routing/source_reranking_ci/latest
      - --n-bootstrap
      - "1000"

  h002-source-rerank-sensitivity:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/run_source_reranking_sensitivity.py
      - --repo-root
      - /workspace
      - --internal-split-dir
      - /workspace/experiments/H002_compatibility_routing/splits/latest
      - --materialization-dir
      - /workspace/experiments/H002_compatibility_routing/source_reranking_materialization/latest
      - --base-evaluation-dir
      - /workspace/experiments/H002_compatibility_routing/source_reranking_evaluation/latest
      - --out
      - /workspace/experiments/H002_compatibility_routing/source_reranking_sensitivity/latest

  h002-relative-horizontal-frame-audit:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/audit_relative_horizontal_frame_route.py
      - --repo-root
      - /workspace
      - --materialization-dir
      - /workspace/experiments/H002_compatibility_routing/source_reranking_materialization/latest
      - --source-reranking-dir
      - /workspace/experiments/H002_compatibility_routing/source_reranking_evaluation/latest
      - --out
      - /workspace/experiments/H002_compatibility_routing/relative_horizontal_frame_audit/latest

  h002-relative-horizontal-route-scorer:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/run_relative_horizontal_route_scorer.py
      - --repo-root
      - /workspace
      - --materialization-dir
      - /workspace/experiments/H002_compatibility_routing/source_reranking_materialization/latest
      - --frame-audit-dir
      - /workspace/experiments/H002_compatibility_routing/relative_horizontal_frame_audit/latest
      - --out
      - /workspace/experiments/H002_compatibility_routing/relative_horizontal_route_scorer/latest

  h002-relative-horizontal-split-route-scorer:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/run_relative_horizontal_split_route_scorer.py
      - --repo-root
      - /workspace
      - --materialization-dir
      - /workspace/experiments/H002_compatibility_routing/source_reranking_materialization/latest
      - --route-scorer-dir
      - /workspace/experiments/H002_compatibility_routing/relative_horizontal_route_scorer/latest
      - --out
      - /workspace/experiments/H002_compatibility_routing/relative_horizontal_split_route_scorer/latest

  h002-main-validation-table-refresh:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/refresh_main_validation_table_after_lateral_lock.py
      - --repo-root
      - /workspace
      - --source-reranking-dir
      - /workspace/experiments/H002_compatibility_routing/source_reranking_evaluation/latest
      - --source-ci-dir
      - /workspace/experiments/H002_compatibility_routing/source_reranking_ci/latest
      - --lateral-dir
      - /workspace/experiments/H002_compatibility_routing/relative_horizontal_split_route_scorer/latest
      - --proximity-dir
      - /workspace/experiments/H002_compatibility_routing/proximity_geometry_only_diagnostic/latest
      - --support-contact-dir
      - /workspace/experiments/H002_compatibility_routing/support_contact_independent_target_repair_diagnostic_freeze/latest
      - --out
      - /workspace/experiments/H002_compatibility_routing/main_validation_table_refresh/latest

  h002-qualitative-evidence-package:
    <<: *h002-common
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/build_qualitative_evidence_package.py
      - --repo-root
      - /workspace
      - --out
      - /workspace/experiments/H002_compatibility_routing/qualitative_evidence_package/latest

  h002-paper-strengthening-assets:
    build:
      context: ../..
      dockerfile: configs/h002/Dockerfile.assets
    image: h002-paper-assets:20260710
    working_dir: /workspace
    user: "${HOST_UID:-1001}:${HOST_GID:-1001}"
    volumes:
      - ../..:/workspace
    command:
      - /workspace/experiments/H002_compatibility_routing/scripts/build_paper_assets.py
      - --repo-root
      - /workspace
      - --paper-root
      - /workspace/paper/h002_compatibility_routing/aaai2027
      - --out
      - /workspace/experiments/H002_compatibility_routing/paper_strengthening_assets/latest
