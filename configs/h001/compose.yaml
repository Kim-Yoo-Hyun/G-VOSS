      - --dataset-root
      - /workspace/local_dataset
      - --model-json
      - /workspace/archive/hypothesis_records/hypothesis/CAND-001/H001_geometry-grounded-verification/artifacts/calibration/p_geom_valid_smoke/model.json
      - --selected-scans
