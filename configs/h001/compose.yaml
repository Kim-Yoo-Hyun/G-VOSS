services:
  table_builder:
    build:
      context: ../..
      dockerfile: configs/h001/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    command:
      - --repo-root
      - /workspace
      - --out
      - /workspace/results/h001_geom_reliability

  bootstrap_ci:
    build:
      context: ../..
      dockerfile: configs/h001/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/src/geocalib/bootstrap_metrics.py
    command:
      - --repo-root
      - /workspace
      - --out
      - /workspace/results/h001_geom_reliability/bootstrap_ci
      - --n-bootstrap
      - "1000"

  bootstrap_ci_nonavg:
    build:
      context: ../..
      dockerfile: configs/h001/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/src/geocalib/bootstrap_metrics.py
    command:
      - --repo-root
      - /workspace
      - --out
      - /workspace/experiments/H001_geom_reliability/sources/open3dsg/non_avg/bootstrap_ci
      - --open3dsg-source-root
      - /workspace/experiments/H001_geom_reliability/sources/open3dsg/non_avg
      - --open3dsg-source-name
      - open3dsg_ov_non_avg
      - --n-bootstrap
      - "1000"

  full_validation_scope_contract:
    build:
      context: ../..
      dockerfile: configs/h001/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/src/geocalib/freeze_full_validation_scope.py
    command:
      - --repo-root
      - /workspace
      - --out
      - /workspace/results/h001_geom_reliability/full_validation_transition/scope_contract

  vlsat_full_validation_stage:
    build:
      context: ../..
      dockerfile: configs/h001/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/src/geocalib/stage_vlsat.py
    command:
      - --selected-scans
      - /workspace/results/h001_geom_reliability/full_validation_transition/scope_contract/scans.txt
      - --artifact-dir
      - /workspace/experiments/H001_geom_reliability/sources/vlsat/full_validation/stage
      - --generated-subset-root
      - /workspace/experiments/H001_geom_reliability/sources/vlsat/full_validation/stage/generated/3DSSG_subset
      - --staged-root
      - /workspace/local_dataset/VLSAT_staged/h001_full_validation/CVPR2023-VLSAT
      - --link-mode
      - symlink
      - --reference-aligned-mode
      - symlink
      - --overwrite

  vlsat_full_validation_runtime_record:
    build:
      context: ../..
      dockerfile: configs/h001/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/src/geocalib/prepare_vlsat_full_validation_runtime.py
    command:
      - --repo-root
      - /workspace
      - --out
      - /workspace/experiments/H001_geom_reliability/sources/vlsat/full_validation/runtime_record

  vlsat_full_validation_raw_preflight:
    image: h001-open3dsg-repro:cu128
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    shm_size: "${VLSAT_SHM_SIZE:-16gb}"
    environment:
      HOME: /workspace/local_dataset/model_cache/home
      XDG_CACHE_HOME: /workspace/local_dataset/model_cache/xdg
      TORCH_HOME: /workspace/local_dataset/model_cache/torch
      PYTHONPATH: /workspace/local_dataset/VLSAT_code/CVPR2023-VLSAT:/workspace/local_dataset/VLSAT_code/CVPR2023-VLSAT/src
    volumes:
      - ../..:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint:
      - python
      - /workspace/src/geocalib/run_vlsat_dump.py
    command:
      - --staged-root
      - /workspace/local_dataset/VLSAT_staged/h001_full_validation/CVPR2023-VLSAT
      - --selected-scans
      - /workspace/results/h001_geom_reliability/full_validation_transition/scope_contract/scans.txt
      - --output-dir
      - /workspace/experiments/H001_geom_reliability/sources/vlsat/full_validation/raw_preflight
      - --baseline-run-id
      - vlsat_full_official_validation_frozen_v1
      - --preflight-only
      - --force-pyg-shim

  vlsat_full_validation_raw_dump:
    image: h001-open3dsg-repro:cu128
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    shm_size: "${VLSAT_SHM_SIZE:-16gb}"
    environment:
      HOME: /workspace/local_dataset/model_cache/home
      XDG_CACHE_HOME: /workspace/local_dataset/model_cache/xdg
      TORCH_HOME: /workspace/local_dataset/model_cache/torch
      PYTHONPATH: /workspace/local_dataset/VLSAT_code/CVPR2023-VLSAT:/workspace/local_dataset/VLSAT_code/CVPR2023-VLSAT/src
    volumes:
      - ../..:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint:
      - python
      - /workspace/src/geocalib/run_vlsat_dump.py
    command:
      - --staged-root
      - /workspace/local_dataset/VLSAT_staged/h001_full_validation/CVPR2023-VLSAT
      - --selected-scans
      - /workspace/results/h001_geom_reliability/full_validation_transition/scope_contract/scans.txt
      - --output-dir
      - /workspace/experiments/H001_geom_reliability/sources/vlsat/full_validation/raw
      - --baseline-run-id
      - vlsat_full_official_validation_frozen_v1
      - --force-pyg-shim

  vlsat_full_validation_adapter_export:
    build:
      context: ../..
      dockerfile: configs/h001/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/src/geocalib/export_predictions.py
    command:
      - --subset-json
      - /workspace/local_dataset/3DSSG_subset/relationships_validation.json
      - --classes-file
      - /workspace/local_dataset/3DSSG_subset/classes.txt
      - --relationships-file
      - /workspace/local_dataset/3DSSG_subset/relationships.txt
      - --selected-scans
      - /workspace/results/h001_geom_reliability/full_validation_transition/scope_contract/scans.txt
      - --raw-dump-jsonl
      - /workspace/experiments/H001_geom_reliability/sources/vlsat/full_validation/raw/raw.jsonl
      - --output-dir
      - /workspace/experiments/H001_geom_reliability/sources/vlsat/full_validation/adapter
      - --split-name
      - full_official_validation
      - --baseline-run-id
      - vlsat_full_official_validation_frozen_v1
      - --export-policy
      - all_non_none_predicates_per_directed_pair

  vlsat_full_validation_geometry_join:
    build:
      context: ../..
      dockerfile: configs/h001/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
