services:
  no_family_indicator_fit:
    build:
      context: ../..
      dockerfile: configs/h001/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/geocalib/fit_no_family_indicator.py]
    command:
      - --repo-root
      - /workspace
      - --protocol
      - /workspace/experiments/H001_geom_reliability/no_family_indicator_v1/protocol.json
      - --out
      - /workspace/experiments/H001_geom_reliability/no_family_indicator_v1/fit

  no_family_indicator_freeze_initial:
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/geocalib/freeze_no_family_indicator_protocols.py]
    command: [--repo-root, /workspace, --phase, initial]

  no_family_indicator_structured_main:
