services:
  relation_algebra_development:
    build:
      context: ../..
      dockerfile: configs/h001/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/geocalib/run_relation_algebra_development.py]
    command:
      - --repo-root
      - /workspace
      - --protocol
      - /workspace/experiments/H001_geom_reliability/relation_algebra_v1/protocol.json
      - --out
      - /workspace/experiments/H001_geom_reliability/relation_algebra_v1/evaluation

