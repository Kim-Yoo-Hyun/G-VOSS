      - /workspace
      - --protocol
      - /workspace/experiments/RelCompat3D_geom_reliability/no_family_indicator_v1/protocols/structured_main.json
      - --out
      - /workspace/experiments/RelCompat3D_geom_reliability/no_family_indicator_v1/evaluation/structured_main

  no_family_indicator_support_routing:
