services:
  no_family_indicator_fit:
    build:
      context: ../..
      dockerfile: configs/relcompat3d/Dockerfile
    image: relcompat3d-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/relcompat3d/fit_linear.py]
    command:
      - --repo-root
      - /workspace
      - --protocol
      - /workspace/experiments/RelCompat3D_geom_reliability/no_family_indicator_v1/protocol.json
      - --out
      - /workspace/experiments/RelCompat3D_geom_reliability/no_family_indicator_v1/fit

  no_family_indicator_freeze_initial:
    image: relcompat3d-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/relcompat3d/freeze_protocols.py]
    command: [--repo-root, /workspace, --phase, initial]

  no_family_indicator_structured_main:
    image: relcompat3d-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/relcompat3d/evaluate_main.py]
