services:
  env_check:
    build:
      context: ../..
      dockerfile: configs/fross/Dockerfile.runtime
    image: h001-fross-replicassg:cu128-trt108
    working_dir: /workspace/local_dataset/FROSS_code
    volumes:
      - ../..:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint:
      - python
      - -c
    command:
      - >-
        import importlib.util, json, torch, tensorrt;
        mods=['tensorrt','onnx','open3d','scipy','plyfile','cv2','transformers','pyvips'];
        print(json.dumps({'torch':torch.__version__,'cuda':torch.version.cuda,'gpu':torch.cuda.get_device_name(0),'capability':torch.cuda.get_device_capability(0),'tensorrt':tensorrt.__version__,'modules':{m:bool(importlib.util.find_spec(m)) for m in mods}},sort_keys=True))

  weight_extract:
    image: h001-fross-replicassg:cu128-trt108
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - -m
      - zipfile
      - -e
    command:
      - /workspace/local_dataset/FROSS_weights/VG.zip
      - /workspace/local_dataset/FROSS_weights/extracted

  engine_export:
    image: h001-fross-replicassg:cu128-trt108
    working_dir: /workspace/local_dataset/FROSS_code
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint:
      - python
      - /workspace/src/geocalib/build_fross_tensorrt_engines.py
    command:
      - --artifact-path
      - /workspace/local_dataset/FROSS_weights/extracted/VG/egtr__RT-DETR__VG__last.pth/batch__6__epochs__50_25__lr__2e-07_2e-06_2e-05__finetune/version_0

  instance_ply:
    build:
      context: ../..
      dockerfile: configs/fross/Dockerfile.render
    image: h001-replicassg-render:habitat022
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/local_dataset/ReplicaSSG_code/extract_instance_ply.py
    command:
      - --replica_path
      - /workspace/local_dataset/ReplicaSSG_runtime

  replicassg_extract_test_habitat:
    image: h001-replicassg-render:habitat022
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - bash
      - /workspace/scripts/extract_replicassg_test_habitat.sh

  replicassg_extract_scene_textures:
    image: h001-replicassg-render:habitat022
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      REPLICASSG_SCENE: "${REPLICASSG_SCENE:-apartment_1}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - bash
      - /workspace/scripts/extract_replicassg_scene_textures.sh

  render_test:
    image: h001-replicassg-render:habitat022
    working_dir: /workspace/local_dataset/ReplicaSSG_code
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DISPLAY: ""
    volumes:
      - ../..:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint:
      - bash
      - /workspace/scripts/render_replicassg_test.sh

  replicassg_render_scene:
    image: h001-replicassg-render:habitat022
    working_dir: /workspace/local_dataset/ReplicaSSG_code
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DISPLAY: ""
    volumes:
      - ../..:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint:
      - python
      - /workspace/local_dataset/ReplicaSSG_code/extract_path.py
    command:
      - --replica_path
      - /workspace/local_dataset/ReplicaSSG_runtime/data
      - --scene
      - "${REPLICASSG_SCENE:-apartment_1}"
      - --replica_to_vg_path
      - /workspace/local_dataset/ReplicaSSG_runtime/ReplicaSSG/replica_to_visual_genome.json
      - --trajectory_json
      - /workspace/local_dataset/ReplicaSSG_runtime/ReplicaSSG/trajectories.json
      - --output_dir
      - /workspace/local_dataset/ReplicaSSG_runtime/data

  inference_test:
    image: h001-fross-replicassg:cu128-trt108
    working_dir: /workspace/local_dataset/FROSS_code/Merging
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      PYTHONPATH: /workspace/local_dataset/FROSS_code:/workspace/local_dataset/FROSS_code/EGTR
      HOME: /workspace/local_dataset/model_cache/fross_home
      HF_HOME: /workspace/local_dataset/model_cache/huggingface
      TRANSFORMERS_CACHE: /workspace/local_dataset/model_cache/huggingface/transformers
    volumes:
      - ../..:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint:
      - python
      - /workspace/local_dataset/FROSS_code/Merging/main.py
    command:
      - --artifact_path
      - /workspace/local_dataset/FROSS_weights/extracted/VG/egtr__RT-DETR__VG__last.pth/batch__6__epochs__50_25__lr__2e-07_2e-06_2e-05__finetune/version_0
      - --dataset_path
      - /workspace/local_dataset/ReplicaSSG_runtime
      - --output_path
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/fross_raw
      - --label_categories
      - replica
      - --split
      - test
      - --obj_thresh
      - "0.7"
      - --rel_topk
      - "10"
      - --hellinger_threshold
      - "0.85"
      - --not_preload

  official_evaluation:
    image: h001-fross-replicassg:cu128-trt108
    working_dir: /workspace/local_dataset/FROSS_code/Merging
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/local_dataset/FROSS_code/Merging/evaluate.py
    command:
      - --dataset_path
      - /workspace/local_dataset/ReplicaSSG_runtime
      - --label_categories
      - replica
      - --split
      - test
      - --prediction_path
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/fross_raw/replica/predictions_gaussian_obj0.7_rel10_hell0.85_kfnone_test_gtpose.pkl
      - --output_path
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/fross_raw/official_evaluation.txt

  replicassg_validate_shard:
    image: h001-fross-replicassg:cu128-trt108
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      REPLICASSG_EXPECTED_SCENE: "${REPLICASSG_EXPECTED_SCENE:-}"
      REPLICASSG_SHARD: "${REPLICASSG_SHARD:-}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - -c
    command:
      - >-
        import os,pickle;
        path=os.environ['REPLICASSG_SHARD']; scene=os.environ['REPLICASSG_EXPECTED_SCENE'];
        payload=pickle.load(open(path,'rb'));
        assert set(payload)=={scene}, (scene,sorted(payload));
        required={'pcd','cls','edge_index','edge_cls'};
        assert required.issubset(payload[scene]), required-set(payload[scene]);
        print({'status':'valid_shard','scene':scene})

  replicassg_merge_shards:
    image: h001-fross-replicassg:cu128-trt108
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/src/geocalib/merge_replicassg_fross_shards.py
    command:
      - --repo-root
      - /workspace
      - --protocol
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/prospective_protocol/frozen_v1/manifest.json
      - --shard-dir
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/fross_raw/shards
      - --output
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/fross_raw/replica/predictions_gaussian_obj0.7_rel10_hell0.85_kfnone_test_gtpose.pkl
      - --manifest
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/fross_raw/source_manifest.json
      - --weight-zip
      - /workspace/local_dataset/FROSS_weights/VG.zip
      - --artifact-dir
      - /workspace/local_dataset/FROSS_weights/extracted/VG/egtr__RT-DETR__VG__last.pth/batch__6__epochs__50_25__lr__2e-07_2e-06_2e-05__finetune/version_0
      - --docker-service
      - replicassg_merge_shards

  replicassg_fross_adapter:
    image: h001-fross-replicassg:cu128-trt108
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/src/geocalib/export_replicassg_fross_predictions.py
    command:
      - --repo-root
      - /workspace
      - --prediction-pkl
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/fross_raw/replica/predictions_gaussian_obj0.7_rel10_hell0.85_kfnone_test_gtpose.pkl
      - --annotation-root
      - /workspace/local_dataset/ReplicaSSG_code/files
      - --dataset-root
      - /workspace/local_dataset/ReplicaSSG_runtime
      - --protocol
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/prospective_protocol/frozen_v1/manifest.json
      - --out
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/adapter
      - --docker-service
      - replicassg_fross_adapter

  replicassg_geometry:
    image: h001-fross-replicassg:cu128-trt108
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/src/geocalib/score_replicassg_geometry.py
    command:
      - --repo-root
      - /workspace
      - --predictions
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/adapter/predictions.jsonl
      - --dataset-root
      - /workspace/local_dataset/ReplicaSSG_runtime
      - --protocol
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/prospective_protocol/frozen_v1/manifest.json
      - --out
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/geometry
      - --docker-service
      - replicassg_geometry

  replicassg_evaluation:
    image: h001-fross-replicassg:cu128-trt108
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/src/geocalib/run_replicassg_prospective_evaluation.py
    command:
      - --repo-root
      - /workspace
      - --verification
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/geometry/verification.jsonl
      - --ground-truth
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/prospective_protocol/frozen_v1/ground_truth.jsonl
      - --models
      - /workspace/experiments/H001_geom_reliability/train_only_reestablishment_v1/calibration/fitted/models.json
      - --protocol
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/prospective_protocol/frozen_v1/manifest.json
      - --final-lock
      - /workspace/experiments/H001_geom_reliability/train_only_reestablishment_v1/final_lock.json
      - --adapter-manifest
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/adapter/manifest.json
      - --geometry-manifest
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/geometry/manifest.json
      - --source-manifest
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/fross_raw/source_manifest.json
      - --out
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/evaluation
      - --n-bootstrap
      - "1000"
      - --seed
      - "20260711"
      - --docker-service
      - replicassg_evaluation

  replicassg_development_v2:
    image: h001-fross-replicassg:cu128-trt108
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/src/geocalib/run_replicassg_development_v2.py
    command:
      - --repo-root
      - /workspace
      - --verification
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/development_v2/runtime/geometry/verification.jsonl
      - --ground-truth
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/prospective_protocol/frozen_v1/ground_truth.jsonl
      - --models
      - /workspace/experiments/H001_geom_reliability/train_only_reestablishment_v1/calibration/fitted/models.json
      - --protocol
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/development_v2/protocol.json
      - --out
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/development_v2/evaluation
      - --n-bootstrap
      - "1000"
      - --seed
      - "20260712"
      - --docker-service
      - replicassg_development_v2

  replicassg_development_v2_merge_shards:
    image: h001-fross-replicassg:cu128-trt108
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/src/geocalib/merge_replicassg_fross_shards.py
    command:
      - --repo-root
      - /workspace
      - --protocol
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/prospective_protocol/frozen_v1/manifest.json
      - --shard-dir
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/development_v2/runtime/fross_raw/shards
      - --output
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/fross_raw/replica/predictions_gaussian_obj0.7_rel10_hell0.85_kfnone_test_gtpose.pkl
      - --manifest
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/development_v2/runtime/fross_raw/source_manifest.json
      - --weight-zip
      - /workspace/local_dataset/FROSS_weights/VG.zip
      - --artifact-dir
      - /workspace/local_dataset/FROSS_weights/extracted/VG/egtr__RT-DETR__VG__last.pth/batch__6__epochs__50_25__lr__2e-07_2e-06_2e-05__finetune/version_0
      - --docker-service
      - replicassg_development_v2_merge_shards

  replicassg_development_v2_adapter:
    image: h001-fross-replicassg:cu128-trt108
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/src/geocalib/export_replicassg_fross_predictions.py
    command:
      - --repo-root
      - /workspace
      - --prediction-pkl
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/fross_raw/replica/predictions_gaussian_obj0.7_rel10_hell0.85_kfnone_test_gtpose.pkl
      - --annotation-root
      - /workspace/local_dataset/ReplicaSSG_code/files
      - --dataset-root
      - /workspace/local_dataset/ReplicaSSG_runtime
      - --protocol
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/prospective_protocol/frozen_v1/manifest.json
      - --out
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/development_v2/runtime/adapter
      - --docker-service
      - replicassg_development_v2_adapter

  replicassg_development_v2_geometry:
    image: h001-fross-replicassg:cu128-trt108
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/src/geocalib/score_replicassg_geometry.py
    command:
      - --repo-root
      - /workspace
      - --predictions
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/development_v2/runtime/adapter/predictions.jsonl
      - --dataset-root
      - /workspace/local_dataset/ReplicaSSG_runtime
      - --protocol
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/prospective_protocol/frozen_v1/manifest.json
      - --out
      - /workspace/experiments/H001_geom_reliability/sources/replicassg/development_v2/runtime/geometry
      - --docker-service
      - replicassg_development_v2_geometry
