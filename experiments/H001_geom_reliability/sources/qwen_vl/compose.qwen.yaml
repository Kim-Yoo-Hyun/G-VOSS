services:
  qwen_vl_base: &qwen_vl_base
    build:
      context: ../../../..
      dockerfile: experiments/H001_geom_reliability/sources/qwen_vl/Dockerfile.qwen
    image: h001-qwen-vl-runtime:cu128
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HF_HOME: /workspace/local_dataset/model_cache/huggingface
      TRANSFORMERS_CACHE: /workspace/local_dataset/model_cache/huggingface
      XDG_CACHE_HOME: /workspace/local_dataset/model_cache/xdg
      HOME: /workspace/local_dataset/model_cache/home
      QWEN_VL_MODEL_ID: ${QWEN_VL_MODEL_ID:-Qwen/Qwen3-VL-4B-Instruct}
      QWEN_VL_MODEL_REVISION: ${QWEN_VL_MODEL_REVISION:-ebb281ec70b05090aa6165b016eac8ec08e71b17}
      QWEN_VL_LOCAL_DIR: ${QWEN_VL_LOCAL_DIR:-/workspace/local_dataset/model_cache/huggingface/qwen_vl/Qwen3-VL-4B-Instruct/ebb281ec70b05090aa6165b016eac8ec08e71b17}
    volumes:
      - ../../../..:/workspace

  qwen_vl_model_download:
    <<: *qwen_vl_base
    entrypoint:
      - huggingface-cli
    command:
      - download
      - ${QWEN_VL_MODEL_ID:-Qwen/Qwen3-VL-4B-Instruct}
      - --revision
      - ${QWEN_VL_MODEL_REVISION:-ebb281ec70b05090aa6165b016eac8ec08e71b17}
      - --local-dir
      - ${QWEN_VL_LOCAL_DIR:-/workspace/local_dataset/model_cache/huggingface/qwen_vl/Qwen3-VL-4B-Instruct/ebb281ec70b05090aa6165b016eac8ec08e71b17}

  qwen_vl_cache_verify:
    <<: *qwen_vl_base
    entrypoint:
      - python
      - /opt/h001/scripts/run_qwen_vl_runtime_smoke.py
    command:
      - --mode
      - cache_verify
      - --repo-root
      - /workspace
      - --out
      - /workspace/experiments/H001_geom_reliability/sources/qwen_vl/runtime_smoke/cache

  qwen_vl_runtime_preflight:
    <<: *qwen_vl_base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint:
      - python
      - /opt/h001/scripts/run_qwen_vl_runtime_smoke.py
    command:
      - --mode
      - preflight
      - --repo-root
      - /workspace
      - --out
      - /workspace/experiments/H001_geom_reliability/sources/qwen_vl/runtime_smoke/preflight
      - --fail-if-gpu-busy

  qwen_vl_tiny_inference_smoke:
    <<: *qwen_vl_base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint:
      - python
      - /opt/h001/scripts/run_qwen_vl_runtime_smoke.py
    command:
      - --mode
      - tiny_inference
      - --repo-root
      - /workspace
      - --out
      - /workspace/experiments/H001_geom_reliability/sources/qwen_vl/runtime_smoke/tiny_inference
      - --limit
      - ${QWEN_VL_TINY_INFERENCE_LIMIT:-3}
      - --fail-if-gpu-busy
