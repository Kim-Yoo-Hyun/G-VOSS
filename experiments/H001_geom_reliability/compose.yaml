      - --raw-dump-jsonl
      - /workspace/experiments/H001_geom_reliability/sources/vlsat/full_validation/raw/raw.jsonl
      - --output-dir
      - /workspace/experiments/H001_geom_reliability/sources/vlsat/full_validation/adapter
