services:
  table_builder:
    build:
      context: ../..
      dockerfile: experiments/H001_geom_reliability/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    command:
      - --repo-root
      - /workspace
      - --out
      - /workspace/experiments/H001_geom_reliability

  bootstrap_ci:
    build:
      context: ../..
      dockerfile: experiments/H001_geom_reliability/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/experiments/H001_geom_reliability/scripts/bootstrap_metrics.py
    command:
      - --repo-root
      - /workspace
      - --out
      - /workspace/experiments/H001_geom_reliability/bootstrap_ci
      - --n-bootstrap
      - "1000"

  bootstrap_ci_nonavg:
    build:
      context: ../..
      dockerfile: experiments/H001_geom_reliability/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/experiments/H001_geom_reliability/scripts/bootstrap_metrics.py
    command:
      - --repo-root
      - /workspace
      - --out
      - /workspace/experiments/H001_geom_reliability/sources/open3dsg/non_avg/bootstrap_ci
      - --open3dsg-source-root
      - /workspace/experiments/H001_geom_reliability/sources/open3dsg/non_avg
      - --open3dsg-source-name
      - open3dsg_ov_non_avg
      - --n-bootstrap
      - "1000"

  full_validation_scope_contract:
    build:
      context: ../..
      dockerfile: experiments/H001_geom_reliability/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /opt/h001/scripts/freeze_full_validation_scope.py
    command:
      - --repo-root
      - /workspace
      - --out
      - /workspace/experiments/H001_geom_reliability/full_validation_transition/scope_contract

  vlsat_full_validation_stage:
    build:
      context: ../..
      dockerfile: experiments/H001_geom_reliability/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /workspace/hypothesis/CAND-001/H001_geometry-grounded-verification/tools/stage_vlsat.py
    command:
      - --selected-scans
      - /workspace/experiments/H001_geom_reliability/full_validation_transition/scope_contract/scans.txt
      - --artifact-dir
      - /workspace/experiments/H001_geom_reliability/sources/vlsat/full_validation/stage
      - --generated-subset-root
      - /workspace/experiments/H001_geom_reliability/sources/vlsat/full_validation/stage/generated/3DSSG_subset
      - --staged-root
      - /workspace/local_dataset/VLSAT_staged/h001_full_validation/CVPR2023-VLSAT
      - --link-mode
      - symlink
      - --reference-aligned-mode
      - symlink
      - --overwrite

  vlsat_full_validation_runtime_record:
    build:
      context: ../..
      dockerfile: experiments/H001_geom_reliability/Dockerfile
    image: h001-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint:
      - python
      - /opt/h001/scripts/prepare_vlsat_full_validation_runtime.py
    command:
      - --repo-root
      - /workspace
      - --out
      - /workspace/experiments/H001_geom_reliability/sources/vlsat/full_validation/runtime_record

  vlsat_full_validation_raw_preflight:
    image: h001-open3dsg-repro:cu128
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    shm_size: "${VLSAT_SHM_SIZE:-16gb}"
    environment:
      HOME: /workspace/local_dataset/model_cache/home
      XDG_CACHE_HOME: /workspace/local_dataset/model_cache/xdg
      TORCH_HOME: /workspace/local_dataset/model_cache/torch
      PYTHONPATH: /workspace/local_dataset/VLSAT_code/CVPR2023-VLSAT:/workspace/local_dataset/VLSAT_code/CVPR2023-VLSAT/src
    volumes:
      - ../..:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint:
      - python
      - /workspace/hypothesis/CAND-001/H001_geometry-grounded-verification/tools/run_vlsat_dump.py
    command:
      - --staged-root
      - /workspace/local_dataset/VLSAT_staged/h001_full_validation/CVPR2023-VLSAT
      - --selected-scans
      - /workspace/experiments/H001_geom_reliability/full_validation_transition/scope_contract/scans.txt
      - --output-dir
      - /workspace/experiments/H001_geom_reliability/sources/vlsat/full_validation/raw_preflight
      - --baseline-run-id
      - vlsat_full_official_validation_frozen_v1
      - --preflight-only
      - --force-pyg-shim

  vlsat_full_validation_raw_dump:
    image: h001-open3dsg-repro:cu128
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    shm_size: "${VLSAT_SHM_SIZE:-16gb}"
    environment:
      HOME: /workspace/local_dataset/model_cache/home
      XDG_CACHE_HOME: /workspace/local_dataset/model_cache/xdg
      TORCH_HOME: /workspace/local_dataset/model_cache/torch
      PYTHONPATH: /workspace/local_dataset/VLSAT_code/CVPR2023-VLSAT:/workspace/local_dataset/VLSAT_code/CVPR2023-VLSAT/src
    volumes:
      - ../..:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint:
      - python
      - /workspace/hypothesis/CAND-001/H001_geometry-grounded-verification/tools/run_vlsat_dump.py
    command:
      - --staged-root
      - /workspace/local_dataset/VLSAT_staged/h001_full_validation/CVPR2023-VLSAT
      - --selected-scans
      - /workspace/experiments/H001_geom_reliability/full_validation_transition/scope_contract/scans.txt
      - --output-dir
      - /workspace/experiments/H001_geom_reliability/sources/vlsat/full_validation/raw
      - --baseline-run-id
      - vlsat_full_official_validation_frozen_v1
      - --force-pyg-shim

  vlsat_full_validation_adapter_export:
    build:
      context: ../..
      dockerfile: experiments/H001_geom_reliability/Dockerfile
    image: h001-geom-reliability:latest
